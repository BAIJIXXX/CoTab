name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build .\CoTab.csproj -c Release

      - name: Publish
        run: dotnet publish .\CoTab.csproj -c Release -p:DebugType=None -o .\publish

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CoTab
          path: .\publish\
          if-no-files-found: error
